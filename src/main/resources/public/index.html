<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset = "UTF-8">
    <title>APLICACION WEB</title>   
</head>
<body>
    <h1>SERVIDOR JAVA - Servicios y recursos estáticos</h1>
    <img src="costaAmalfitana.png" alt="Costa Amalfitana" width="300">
    
    <h2>Saludo</h2>
    <input type="text" id="nombre" placeholder="Tu nombre">
    <button id="btnSaludo">Saludar</button>
    
    <h2>Cuadrado</h2>
    <input type="number" id="numero" placeholder="Un número">
    <button id="btnCuadrado">Calcular cuadrado</button>
    
    <h2>Hora del servidor</h2>
    <button id="btnHora">Consultar hora</button>
    
    <h2>Resultado</h2>
    <div id="resultado" style="color: green;"></div>
    
    <h2>Errores</h2>
    <div id="error" style="color: red;"></div>
    
    <img src="img1.jpg" alt="Imagen 1" width="300">
    
    <script src = "app.js"></script>
    
</body>
</html>
